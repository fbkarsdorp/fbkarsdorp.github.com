<!doctype html><html><head><meta charset="utf-8">
<!-- The social preview card, static/images/social-preview-leeszaal.jpg (1200x630).
     Edit the text or tiles here, then render it from the project root with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
       --virtual-time-budget=6000 --window-size=1200,630 \
       --screenshot=/tmp/social.png "file://$PWD/scripts/social-preview.html"
     sips -s format jpeg -s formatOptions 88 /tmp/social.png --out static/images/social-preview-leeszaal.jpg
     Tiles are [x, y] of 192x272 tiles in static/images/papers/atlas.jpg (data/covers.json),
     newest first; each is paler than the one before. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400&family=Spectral:wght@400&family=DM+Mono:wght@400&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#efece4;color:#111;font-family:'Hanken Grotesk',sans-serif;position:relative}
.top{position:absolute;left:0;right:0;top:0;height:64px;padding:0 56px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.top span:last-child{text-transform:none;letter-spacing:0}
h1{position:absolute;left:52px;top:104px;margin:0;font-weight:300;font-size:88px;line-height:.98;letter-spacing:-.035em;width:1100px}
.fade{background:linear-gradient(90deg,#111 0%,rgba(17,17,17,.42) 48%,rgba(17,17,17,.07) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot{position:absolute;left:56px;right:56px;bottom:52px;display:flex;justify-content:space-between;align-items:flex-end}
.name{font-family:Spectral,serif;font-size:42px;line-height:1}
.inst{margin-top:12px;font-family:'DM Mono',monospace;font-size:14px;color:#3d3b37}
.pages{display:flex;gap:14px}
.pg{width:96px;height:136px;background:#fff url("../static/images/papers/atlas.jpg") no-repeat;background-size:768px 408px;box-shadow:0 0 0 1px rgba(17,17,17,.14),4px 4px 0 #dcd8ce}
</style></head><body>
<div class="top"><span>Fragments of Cultural Change</span><span>www.karsdorp.io</span></div>
<h1>How culture spreads, develops and <span class="fade">disappears</span></h1>
<div class="foot">
  <div><div class="name">Folgert Karsdorp</div><div class="inst">Meertens Institute · Utrecht University</div></div>
  <div class="pages" id="pages"></div>
</div>
<script>
var tiles=[[1152,544],[960,544],[768,544],[576,544],[384,544],[192,544]], op=[1,.82,.62,.44,.28,.16];
tiles.forEach(function(t,i){var d=document.createElement('div');d.className='pg';d.style.backgroundPosition=(-t[0]/2)+'px '+(-t[1]/2)+'px';d.style.opacity=op[i];document.getElementById('pages').appendChild(d);});
</script></body></html>
