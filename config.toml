baseURL = "https://www.karsdorp.io/"
languageCode = "en-us"
theme = "hugo-winston-theme"
themesDir = "themes"
title = "Folgert Karsdorp"
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
refLinksErrorLevel = "WARNING"
pygmentsUseClasses = true
publishDir = "docs"

[pagination]
  pagerSize = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  # Layouts, styles and scripts live in layouts/ and assets/ (they replace the
  # winston theme's); colours and type are tokens at the top of assets/css/site.css.
  description = "Folgert Karsdorp studies how culture spreads, develops and disappears, with methods from ecology, population genetics and machine learning."
  # Homepage hero: "leeszaal" (the research statement on paper, with the bio;
  # the statement is `statement` in content/_index.md), or one of the older
  # night heroes: "papers" (the floating books are the publications in
  # references.bib) or "unseen" (the Chao1 unseen-species experiment).
  # Switch socialImage (and its alt text) along with it. A page can set its own
  # with `image` and `imageAlt` in its front matter.
  hero = "leeszaal"
  # Leeszaal card (made from scripts/social-preview.html); the night heroes'
  # cards are images/social-preview-papers.jpg and images/social-preview-unseen.jpg.
  socialImage = "images/social-preview-leeszaal.jpg"
  socialImageAlt = "How culture spreads, develops and disappears: the last word fades into the paper, above Folgert Karsdorp's name and a row of first pages from his papers, each older one paler."
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@400;500&display=swap"

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

[menu]
  [[menu.main]]
    name = "Fragments"
    identifier = "notebooks"
    weight = 2
    url = "/posts/"
  [[menu.main]]
    name = "Playground"
    identifier = "playground"
    weight = 4
    url = "/#playground"
  [[menu.main]]
    name = "Publications"
    url = "/references/"
    weight = 10
  [[menu.main]]
    name = "CV"
    url = "https://raw.githubusercontent.com/fbkarsdorp/fbkarsdorp.github.com/master/tex/main.pdf"
    weight = 20
