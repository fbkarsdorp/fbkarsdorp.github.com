baseURL = "https://www.karsdorp.io/"
languageCode = "en-us"
theme = "hugo-winston-theme"
themesDir = "themes"
title = "Folgert Karsdorp"
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
refLinksErrorLevel = "WARNING"
pygmentsUseClasses = true
publishDir = "docs"

[pagination]
  pagerSize = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  google_analytics_id = ""
  twitter_handle = "@zerostaticio"
  showAuthorOnHomepage = false
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  usePaginationOnHomepage = false
  limitPostsOnHomepage = 3 # only used if usePaginationOnHomepage is false
  sortPostsByDateOldestFirst = false
  addDot = true
  addFrame = true
  highlightColor = '#00968A'
  baseColor = "#F5F7FA"
  baseOffsetColor = "#E8EBF0"
  headingColor = "#0F1117"
  textColor = "#3D4451"
  dotColor = "#00968A"
  enableGoogleFonts = true
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap"
  fontFamilyHeading = "'Space Mono', monospace"
  fontFamilyParagraph = "'IBM Plex Sans', sans-serif"
  fontFamilyMonospace = "'IBM Plex Mono', monospace"

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = "Notebooks"
    identifier = "notebooks"
    weight = 2
    url = "/posts/"
  [[menu.main]]
    name = "Publications"
    url = "/references"
    weight = 10    